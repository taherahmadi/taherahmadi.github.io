<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#FCFCFA"/>
  <!-- store shelves -->
  <g fill="#E4E4DE">
    <rect x="90" y="70" width="200" height="34"/>
    <rect x="90" y="160" width="200" height="34"/>
    <rect x="90" y="250" width="200" height="34"/>
    <rect x="360" y="70" width="150" height="34"/>
    <rect x="360" y="160" width="150" height="34"/>
    <rect x="360" y="250" width="150" height="34"/>
  </g>
  <!-- recorded human trajectories -->
  <path d="M40 360 C120 330 100 220 150 200 C210 175 260 230 330 210 C390 195 420 140 520 120"
        stroke="#3450C8" stroke-width="4.5" fill="none" opacity="0.85"/>
  <path d="M60 360 C90 300 200 320 260 300 C330 278 420 300 545 260"
        stroke="#D9480F" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M330 360 C330 320 320 250 355 235 C400 215 470 225 540 200"
        stroke="#1C1C1A" stroke-width="3.5" fill="none" opacity="0.45"/>
  <!-- people with gaze ticks -->
  <g fill="#1C1C1A">
    <circle cx="150" cy="200" r="10"/><circle cx="260" cy="300" r="10"/><circle cx="355" cy="235" r="10"/>
  </g>
  <g stroke="#1C1C1A" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="200" x2="176" y2="188"/>
    <line x1="260" y1="300" x2="286" y2="292"/>
    <line x1="355" y1="235" x2="380" y2="222"/>
  </g>
  <text x="40" y="52" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#8A8A84">trajectories + pose + gaze</text>
</svg>
