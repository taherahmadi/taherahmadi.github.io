  <path d="M95 220 C230 210 400 215 500 221" stroke="#3450C8" stroke-width="3.5" fill="none" opacity="0.35"/>
  <path d="M95 220 C220 275 350 315 440 329" stroke="#3450C8" stroke-width="2.5" fill="none" opacity="0.18"/>
  <text x="40" y="52" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#8A8A84">argmax p(goal | path)</text>
