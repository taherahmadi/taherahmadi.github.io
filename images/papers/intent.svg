    <rect x="470" y="60" width="46" height="46" fill="none" stroke="#1C1C1A" stroke-width="4"/>
    <circle cx="493" cy="83" r="66" fill="#3450C8" opacity="0.28"/>
    <text x="452" y="140" fill="#3450C8">p=0.71</text>
    <rect x="500" y="200" width="42" height="42" fill="none" stroke="#8A8A84" stroke-width="3"/>
    <circle cx="521" cy="221" r="34" fill="#3450C8" opacity="0.13"/>
    <text x="482" y="272" >p=0.21</text>
    <rect x="440" y="310" width="38" height="38" fill="none" stroke="#8A8A84" stroke-width="3"/>
